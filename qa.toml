# QA capture target: the Spec Chat review page (annotateanything
# docs/specs/jev-capture.spec.html#jc-target). Commands run in the environment root
# with QA_ROOT, QA_FIXTURE, QA_REPO_<REPO>, QA_HEAD_<REPO>, QA_URL_<SERVICE>; a
# service also gets PORT, reset gets QA_STORY. Python stdlib only: no setup or rebuild.

# Test paths searched for a no-browser criterion's anchor.
tests = ["tests"]

[repos.spec-chat]
url = "https://github.com/0xTomDaniel/spec-chat.git"

[services.review]
# The real review-serve.py on the fixture registry, Jev answered by the rules test's
# fake provider (tests/fixtures/qa/serve.py). Box state isolated: HOME, XDG state and
# config under $QA_ROOT, no Herdr socket, so no provider file or records, but for reset.sh's
# fake wake provider: every owner is present, and each wake is a line in $QA_ROOT/wakes.log.
command = 'mkdir -p "$QA_ROOT/home" "$QA_ROOT/state" "$QA_ROOT/config" && cd "$QA_REPO_SPEC_CHAT" && exec env -u HERDR_SOCKET_PATH HOME="$QA_ROOT/home" XDG_STATE_HOME="$QA_ROOT/state" XDG_CONFIG_HOME="$QA_ROOT/config" python3 tests/fixtures/qa/serve.py "$QA_ROOT/serve/registry.toml" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/qa-fixture/docs/specs/report.spec.html"

[services.review-second]
# A second review service (served-pages #served-storage): the same command on reset.sh's fourth registry, public too,
# which holds served-storage-return and served-storage-stored at the review service's roots, so their specs are on two
# review services, and served-storage-service at its own copy, so its spool is not the review service's. Its own state,
# and no wake provider, so only the review service wakes an owner.
command = 'mkdir -p "$QA_ROOT/home" "$QA_ROOT/state-second" "$QA_ROOT/config" && cd "$QA_REPO_SPEC_CHAT" && exec env -u HERDR_SOCKET_PATH HOME="$QA_ROOT/home" XDG_STATE_HOME="$QA_ROOT/state-second" XDG_CONFIG_HOME="$QA_ROOT/config" python3 tests/fixtures/qa/serve.py "$QA_ROOT/serve-second/registry.toml" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/served-storage-service/docs/specs/report.spec.html"

[services.host]
# The fixture's test host (tests/fixtures/qa/host.py): serves the review services' pages at its own
# address, each with a base address naming the page, in a frame sandboxed without same-origin access,
# so the page runs with no origin (served-pages #served-rule). Declared after review and review-second, so it starts
# with QA_URL_REVIEW and QA_URL_REVIEW_SECOND. {host}/<path> frames review's page at <path>; its header's Service 1
# and Service 2 buttons open the page at <path> from review and from review-second in the same frame.
# {host}/named/<path> is the same host page with its frame named by the host, the name cleared once the page has loaded.
command = 'cd "$QA_REPO_SPEC_CHAT" && exec python3 tests/fixtures/qa/host.py "$QA_URL_REVIEW" "$QA_URL_REVIEW_SECOND" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/"

[services.shell]
# The fixture's test shell (tests/fixtures/qa/shell.py, shell #shell): frames review's page at <path> held, beside
# review's comment UI page (/comments), or with it as a sheet on a phone, and relays the shell messages between them by
# window. Declared after review, so it starts with QA_URL_REVIEW; reset.sh names its origin (QA_URL_SHELL) in review's
# registry as box setup's --shell does, so the pages it frames are held. {shell}/<path> holds review's page at <path>; the
# bar's Messages lists every message it relays and the page's last publish, and Comments shows the comment UI again.
# {shell}/bare/<path> is the same with its frames sandboxed with no origin.
command = 'cd "$QA_REPO_SPEC_CHAT" && exec python3 tests/fixtures/qa/shell.py "$QA_URL_REVIEW" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/"

[services.shell-other]
# The same test shell at another origin, which the box names nowhere (shell #shell-setting-obey): it says hello
# with comments too, and the page it frames stays alone.
command = 'cd "$QA_REPO_SPEC_CHAT" && exec python3 tests/fixtures/qa/shell.py "$QA_URL_REVIEW" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/"

[services.prototype]
# The fixture's running prototype (tests/fixtures/qa/prototype.py, mockups #prototype): a tiny product on loopback serving
# reports/weekly, the weekly report screen, only at its root, its page loading its script and style by absolute paths,
# as a product ships. reset.sh names its address (QA_URL_PROTOTYPE) on the prototype collections' rows, as the lane
# command's --prototype does, so review-prototype serves it at each one's prototype origin, <slug>-prototype. before
# the service's host name (review-service #prototype-proxy).
command = 'cd "$QA_REPO_SPEC_CHAT" && exec python3 tests/fixtures/qa/prototype.py "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/"

[services.review-prototype]
# The review service on reset.sh's prototype registry, which holds the prototype collections and records no public base
# address, so it is private on loopback and each lane's prototype origin is http://<slug>-prototype.localhost:<port>,
# which a browser reaches on loopback (review-service #prototype-proxy): a mockup page frames its route there, held across
# the two origins (shell #shell-msg-prototype). prototype-own-chrome's row names this service itself (QA_URL_REVIEW_PROTOTYPE)
# as the lane's prototype, its own review service run on the fixture's data. Its own state.
command = 'mkdir -p "$QA_ROOT/home" "$QA_ROOT/state-prototype" "$QA_ROOT/config" && cd "$QA_REPO_SPEC_CHAT" && exec env -u HERDR_SOCKET_PATH HOME="$QA_ROOT/home" XDG_STATE_HOME="$QA_ROOT/state-prototype" XDG_CONFIG_HOME="$QA_ROOT/config" python3 tests/fixtures/qa/serve.py "$QA_ROOT/serve-prototype/registry.toml" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/prototype-frames/docs/specs/report-page.spec.html"

[services.evidence]
# The evidence provider's answers (review-index #index-gates-provider). The provider is a peer outside
# this repository, so its answers are fixture data (annotateanything jev-capture #qa-rules-real-data):
# reset.sh declares its review facts answer and a bundle page under $QA_ROOT/evidence, served here as
# files, so GET /review-facts reads the declared answer and /bundles/qa-proof/ the bundle page.
command = 'exec python3 -I -m http.server "$PORT" --bind 127.0.0.1 --directory "$QA_ROOT/evidence"'
url = "http://127.0.0.1:{port}"
ready = "/"

[services.review-plugged]
# The review service with the evidence provider plugged (review-service #providers-evidence): the
# same command on reset.sh's second registry, whose folder holds the provider file reset.sh writes,
# naming the evidence service. Its own state, so its Jev records stay apart from review's.
command = 'mkdir -p "$QA_ROOT/home" "$QA_ROOT/state-plugged" "$QA_ROOT/config" && cd "$QA_REPO_SPEC_CHAT" && exec env -u HERDR_SOCKET_PATH HOME="$QA_ROOT/home" XDG_STATE_HOME="$QA_ROOT/state-plugged" XDG_CONFIG_HOME="$QA_ROOT/config" python3 tests/fixtures/qa/serve.py "$QA_ROOT/serve-plugged/registry.toml" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/qa-8/docs/specs/later-only.spec.html"

[services.review-sections]
# The review service on reset.sh's third registry, which holds exactly the parts review-index #index-sections names: a
# lane with an open decision, a lane whose specs are all with the agent, and a collection under a slug that is no lane
# key. Its own state, so its Jev records stay apart from review's.
command = 'mkdir -p "$QA_ROOT/home" "$QA_ROOT/state-sections" "$QA_ROOT/config" && cd "$QA_REPO_SPEC_CHAT" && exec env -u HERDR_SOCKET_PATH HOME="$QA_ROOT/home" XDG_STATE_HOME="$QA_ROOT/state-sections" XDG_CONFIG_HOME="$QA_ROOT/config" python3 tests/fixtures/qa/serve.py "$QA_ROOT/serve-sections/registry.toml" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/qa-11/docs/specs/report.spec.html"

# One Git repo of six specs, copied per collection (reset.sh): onboarding.spec.html marks the project rule "Every change
# to what a user sees or does adds its onboarding section.", named "Every change ships its onboarding"; report.spec.html is the
# spec under shaping, its head adding an export story with no onboarding criterion,
# two open TBDs, the first offering two answer buttons, and one later TBD; later-only.spec.html's only TBD is later;
# one-open.spec.html has exactly one open TBD; long-title.spec.html, registered only in qa-10, has a long title and no
# TBD; print.spec.html, registered only in coverage-undeclared, has stories
# and criteria that name no story (no data-story), its head rewording two sections. No spec has a comment thread, except
# the review-state collections' report spec and the index gate lanes' later-only spec (spools.py, nav hints below). Jev
# records are written by the fake as pages load and kept across resets; dismissals
# are not, since each reset registers fresh projects. In rule-candidate the onboarding
# criterion is unmarked, so it is a candidate on its home spec (story-approve). In rule-pending the report spec gains a
# sentence whose rule check the fake holds unanswered while the service runs, recording nothing; in rule-answer another,
# whose rule check the fake answers, missed, a few seconds after its first ask (spools.py HELD).
[fixture.spec_review_site]
repo = "spec-chat"
path = "tests/fixtures/qa"
reset = 'sh "$QA_FIXTURE/reset.sh"'

[entry]
url = "{review}/qa-fixture/docs/specs/report.spec.html"
viewport = { width = 1280, height = 800 }

# Phone-frame story: "Given a narrow screen" runs at a phone viewport with touch and
# mobile emulation, below the runtime's 640px narrow breakpoint.
[entry.stories.story-mobile]
viewport = { width = 390, height = 844 }
touch = true

# Review index story-index-calm: "a narrow pane" is narrower than the index's 48rem column, yet wider than the
# design set's 640px phone width, under which the gate word moves under its title (review-index #index-design).
[entry.stories.story-index-calm]
viewport = { width = 720, height = 800 }

# Rule-card capture hints, per criterion (the capture agent reads these). The rule marker is
# the "Jev notes" button beside the Acceptance criteria heading; opening it shows the rule card
# "Every change ships its onboarding". Every collection except rule-candidate, not-a-rule, dismiss,
# dismiss-reload, and rule-main-only is the same project, so its report spec is another spec of the project
# missing the same rule, except rule-pending's, whose rule check stays pending, and rule-answer's, whose rule check is
# pending until answered a few seconds after it is first asked (pending hints below).
# - miss, dismiss, dismiss-reload, dismiss-no-unrule, ask: open the rule marker
#   beside Acceptance criteria to show the card first.
# - dismiss: the page is the dismiss collection's report spec (its own project, so the click
#   hides no sibling's marker); then click Not for this spec; capture the card closing, with no reload.
# - dismiss-reload: the page is the dismiss-reload collection's report spec (its own project);
#   then click Not for this spec, then reload the page (browser reload).
# - advice: the page is the report spec with no open TBD (its TBDs are later), so the hand-off
#   button reads Accept spec, and the missed note is the rule marker beside Acceptance
#   criteria. Click Accept spec; nothing is typed.
# - clear-thread: the page is the clear-thread report spec. Open the rule marker to show the card,
#   turn on Comment, click the Acceptance criteria heading, type the value, save, then reload
#   the page (browser reload); the marker is still there.
# - candidates, mark-as-rule, not-a-rule: the page is rule-candidate's onboarding spec, whose
#   onboarding criterion is unmarked; open the marker beside that criterion to show the
#   candidate card first.
# - not-a-rule: the page is the not-a-rule collection's onboarding spec, rule-candidate's twin in
#   its own project; then click Not a project rule; capture the card closing, with no reload.
# - convention-no-candidate: the page is the convention-no-candidate collection's onboarding spec, whose
#   unmarked last criterion says every loading state uses the design system's shared skeleton; open the
#   spec and wait for Jev's notes: that criterion shows no candidate marker.
# - pending, pending-motion: the page is the rule-pending collection's report spec, whose rule check the fixture's
#   general LLM holds unanswered for as long as the service runs; open it, then for pending hover the spot beside
#   the Acceptance criteria heading where the rule marker shows on the other report specs. Nothing is clicked.
# - pending-answer: the page is the rule-answer collection's report spec; open it, then wait for the rule check's
#   answer; nothing is clicked.
# - source-own-lane: the page is qa-fixture's report spec; its collection serves the onboarding spec, as qa-1 and the
#   other collections registering the four specs do. Open the rule marker beside Acceptance criteria, then click the
#   card's source, onboarding · #rule-onboarding.
# - source-main-only: the page is the rule-main-only collection's report spec, its own project, which registers that
#   spec alone; its project's main, origin/main, holds the onboarding spec. Open the rule marker beside Acceptance
#   criteria.
#
# Each criterion below starts on its own clean copy of the fixture repo (reset.sh
# collections): a story resets once, and earlier criteria leave drafts and hand-offs
# in the spec's spool. The spec file names stay the same, so "the report spec" holds.
