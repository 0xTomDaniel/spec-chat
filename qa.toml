# Mockups (mockups.spec.html#acceptance, prompt-first-shaping #acceptance-mockup-*). The mockup collections (reset.sh
# mockups) register Report page (report-page.spec.html) alone. Its mockup set holds three screens: Report page
# (docs/specs/mockups/report-page/01-report-page.mockup.html), changed since the spec row's base; Team page
# (02-team-page.mockup.html), unchanged; and Export dialog (03-export-dialog.mockup.html), new since the base. Report
# page's desktop frame shows three team cards in a row (Payments, Search, Mobile), each with its avatar image, and the
# Export CSV button below them; its phone frame shows the same cards one above the other, and the button. The spec's
# criterion "The report page shows each team as a card with its avatar and its total for the week." is illustrated by
# Report page's frames and cards, "The Export CSV button opens the export dialog." by its Export CSV buttons, and
# "The onboarding tour points to the team cards first." by no mockup. Export dialog is the screen the feature adds; its
# frames illustrate "The export dialog lists the rows the CSV holds and downloads weekly-totals-2026-W01.csv.", its
# dialogs "The Export CSV button opens the export dialog.". Seeded comments are other browsers'
# (spools.py SET_COLLECTIONS), except in mockup-handoff, whose start point keeps Papaya's browser identity, the page's
# own saved state, so the seeded draft is this browser's. A thread's pin sits on the part it marks; the review panel
# opens with the "Open review sidebar" button at the top right.
# Capture hints, per criterion:
# - frames, frames-phone, unchanged, new, mockup-content: the page is Report page's spec page; open the mockup page at
#   the first value's address.
# - comment-element: turn on Comment, click the Payments card's avatar image in the phone frame (the narrower frame),
#   type the value, save.
# - comment-region: turn on Comment, click an empty spot inside the Search card in the desktop frame (the wider frame),
#   right of its total, away from its text and image; type the value, save.
# - comment-phone, comment-phone-pin: tap Comment, then tap the Export CSV button in the desktop frame (the first frame,
#   scaled down to the screen's width), type the value, save. comment-phone-pin: then close the review panel with its
#   "Collapse review sidebar" button.
# - handoff: press Hand off; this browser's draft (Papaya's) is on the Export CSV button in the desktop frame.
# - one-control, one-control-phone: turn on Comment, click the Export CSV button in the desktop frame, type the value,
#   save, then open the review panel.
# - reply: open the thread on the Payments card in the desktop frame with its pin.
# - agent-edit: nothing to click. The fixture agent edits the mockup once the open page has first checked its file
