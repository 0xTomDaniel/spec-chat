# QA capture target: the Spec Chat review page (annotateanything
# docs/specs/jev-capture.spec.html#jc-target). Commands run in the environment root
# with QA_ROOT, QA_FIXTURE, QA_REPO_<REPO>, QA_HEAD_<REPO>, QA_URL_<SERVICE>; a
# service also gets PORT, reset gets QA_STORY. Python stdlib only: no setup or rebuild.

# Test paths searched for a no-browser criterion's anchor.
tests = ["tests"]

[repos.spec-chat]
url = "https://github.com/0xTomDaniel/spec-chat.git"

[services.review]
# The real review-serve.py on the fixture registry, Jev answered by the rules test's
# fake provider (tests/fixtures/qa/serve.py). Box state isolated: HOME, XDG state and
# config under $QA_ROOT, no Herdr socket, so no provider file, wake provider, or records.
command = 'mkdir -p "$QA_ROOT/home" "$QA_ROOT/state" "$QA_ROOT/config" && cd "$QA_REPO_SPEC_CHAT" && exec env -u HERDR_SOCKET_PATH HOME="$QA_ROOT/home" XDG_STATE_HOME="$QA_ROOT/state" XDG_CONFIG_HOME="$QA_ROOT/config" python3 tests/fixtures/qa/serve.py "$QA_ROOT/serve/registry.toml" "$PORT"'
url = "http://127.0.0.1:{port}"
ready = "/qa-fixture/docs/specs/report.spec.html"

# One Git repo of four specs, copied per collection (reset.sh): onboarding.spec.html holds the project rule "Every change
# to what a user sees or does adds its onboarding section."; report.spec.html is the
# spec under shaping, its head adding an export story with no onboarding criterion,
# two open TBDs, and one later TBD; later-only.spec.html's only TBD is later;
# one-open.spec.html has exactly one open TBD. No spec has a comment thread, except
# the review-state collections' report spec (spools.py, nav hints below). Jev
# records are written by the fake as pages load and kept across resets; rule
# decisions are not, since each reset registers fresh projects. The onboarding rule is
# confirmed for stories whose criteria are Given a confirmed rule (reset.sh
# confirmed_stories), a candidate for the rest (story-approve).
[fixture.spec_review_site]
repo = "spec-chat"
path = "tests/fixtures/qa"
reset = 'sh "$QA_FIXTURE/reset.sh"'

[entry]
url = "{review}/qa-fixture/docs/specs/report.spec.html"
viewport = { width = 1280, height = 800 }

# Phone-frame story: "Given a narrow screen" runs at a phone viewport with touch and
# mobile emulation, below the runtime's 640px narrow breakpoint.
[entry.stories.story-mobile]
viewport = { width = 390, height = 844 }
touch = true

# Rule-card capture hints, per criterion (the capture agent reads these). The rule marker is
# the "Jev notes" button beside the Acceptance criteria heading; opening it shows the rule card
# "Every change ships its onboarding". Every collection except rule-candidate and rule-confirmed
# is the same project, so its report spec is another spec of the project missing the same rule.
# - miss, dismiss: open the rule marker beside Acceptance criteria to show the card first.
# - dismiss: then click Not for this spec, then reload the page (browser reload). The edit and
#   commit is the agent's on disk, not a browser step: the When is done after the reload.
# - dismiss-rule: spec B is this page's report spec, spec C is {review}/next-tbd/docs/specs/
#   report.spec.html; both show the card, and the "existing spec misses project rules" offer
#   shows at the top of the page. Open the rule marker, click Not a project rule, reload the
#   page, then open spec C's address in the same tab: that is the reload of C and of an offer page.
# - offer: click "Show specs and the rules they miss" to expand the offer, then click the line's
#   own toggle "Show rules report misses" so the line's rule card shows below it.
# - confirm: click "Show possible project rules", click Confirm rule on the card, reload the page
#   (browser reload), then open the rule marker beside Acceptance criteria so the rule card shows.
# - unconfirmed: the start page is the spec of the project that would miss the candidate, already
#   open: the When is done at page load. Click nothing; report "opened the report spec".
#
# Each criterion below starts on its own clean copy of the fixture repo (reset.sh
# collections): a story resets once, and earlier criteria leave drafts and hand-offs
# in the spec's spool. The spec file names stay the same, so "the report spec" holds.
# A criterion whose Given's rule state differs from its story's has its own project.
[nav.acceptance-candidates]
path = "{review}/rule-candidate/docs/specs/report.spec.html"
[nav.acceptance-confirm]
path = "{review}/rule-candidate/docs/specs/report.spec.html"
[nav.acceptance-dismiss-return]
path = "{review}/rule-confirmed/docs/specs/report.spec.html"
[nav.acceptance-tbd-later]
path = "{review}/tbd-later/docs/specs/later-only.spec.html"
[nav.acceptance-tbd-later-handoff]
path = "{review}/tbd-later-handoff/docs/specs/later-only.spec.html"
[nav.acceptance-tbd-open-highlight]
path = "{review}/tbd-open-highlight/docs/specs/report.spec.html"
[nav.acceptance-tbd-open-single]
path = "{review}/tbd-open-single/docs/specs/one-open.spec.html"
[nav.acceptance-next-tbd]
path = "{review}/next-tbd/docs/specs/report.spec.html"
[nav.acceptance-next-tbd-step]
path = "{review}/next-tbd-step/docs/specs/report.spec.html"
[nav.acceptance-next-tbd-handoff]
path = "{review}/next-tbd-handoff/docs/specs/report.spec.html"
[nav.acceptance-tbd-open-jump]
path = "{review}/tbd-open-jump/docs/specs/report.spec.html"
[nav.acceptance-tbd-open-wrap]
path = "{review}/tbd-open-wrap/docs/specs/report.spec.html"
[nav.acceptance-mobile-composer]
path = "{review}/mobile-composer/docs/specs/report.spec.html"
[nav.acceptance-block-target-enter]
path = "{review}/block-target-enter/docs/specs/report.spec.html"
[nav.acceptance-block-target-space]
path = "{review}/block-target-space/docs/specs/report.spec.html"
[nav.acceptance-block-target-off]
path = "{review}/block-target-off/docs/specs/report.spec.html"

# Review-state collections (tests/fixtures/qa/spools.py). Seeded reviewers are other
# browsers than the capture browser.
#
# Capture hints, per criterion (the capture agent reads these):
# - anchor-moved, anchor-changed, anchor-gone: Papaya's comment is on the selected
#   sentence "The export button downloads a CSV of the current table.". The agent's edit
#   is already on disk before the page loads (moved: a paragraph inserted above it;
#   changed: "of the current table." rewritten; gone: the sentence deleted), so the
#   page load is the refresh. Do not edit any file. The step left is opening that thread
#   with its "Open thread 1" button, so the panel shows its pin ring, quote, and notice
#   (gone: "Text removed" shows only in the opened thread).
# - stale-page: the agent's edit (a paragraph inserted above the export sentence) waits
#   beside the spec and lands when this page next saves an event (tests/fixtures/qa/
#   serve.py), so the page as loaded predates the edit. Steps: turn on Comment (C),
#   select the export sentence's text, type the comment text from values, save. The save
#   brings the "Spec updated by agent" banner; its Reload button is the Then's refresh.
# - name: four steps, all required; do not stop after the first save. 1) Turn on Comment
#   (C), click any block, type the first value, save. The fixture agent answers that comment
#   as it saves (tests/fixtures/qa/serve.py), so the thread offers Reply. 2) Reload the page
#   (browser reload, not the banner). 3) Open that thread with its "Open thread 1" button.
#   4) Click Reply, type the second value, save. Then capture the thread: both of this
#   reviewer's messages and their author.
[nav.acceptance-anchor-moved]
path = "{review}/anchor-moved/docs/specs/report.spec.html"
[nav.acceptance-anchor-changed]
path = "{review}/anchor-changed/docs/specs/report.spec.html"
[nav.acceptance-anchor-gone]
path = "{review}/anchor-gone/docs/specs/report.spec.html"
[nav.acceptance-anchor-stale-page]
path = "{review}/stale-page/docs/specs/report.spec.html"
[nav.acceptance-agent-scan]
path = "{review}/agent-scan/docs/specs/report.spec.html"
[nav.acceptance-name]
path = "{review}/name-reply/docs/specs/report.spec.html"

# Typed text for the review-state criteria that save a message (capture types only these).
[entry.criteria.acceptance-name]
values = ["First note from this browser.", "Reply after reload."]
[entry.criteria.acceptance-anchor-stale-page]
values = ["Name the CSV columns."]
# One capture browser: a When by another live browser, or a Given of two live drafts,
# cannot be driven; the two-browser runtime test proves these.
[entry.criteria.acceptance-live-comment]
cannot_host = "capture has one browser context and cannot save from the first reviewer's page while watching the second; proven by tests/runtime-review-live.mjs"
[entry.criteria.acceptance-live-concurrent]
cannot_host = "capture has one browser context, so two pages cannot save within the same second; proven by tests/runtime-review-live.mjs"
[entry.criteria.acceptance-name-collision]
cannot_host = "capture has one browser context; the Then needs both reviewers' pages showing each other's names; proven by tests/runtime-review-live.mjs"
[entry.criteria.acceptance-edit-race]
cannot_host = "capture has one browser context; the Then needs both reviewers' pages showing the same edit; proven by tests/runtime-review-live.mjs"
[entry.criteria.acceptance-handoff-own]
cannot_host = "capture has one browser context; the Given needs two live browsers each holding a draft, and a seeded draft cannot carry the capture browser's own id; proven by tests/runtime-review-live.mjs"
# Going offline is the device capability capture does not support (jev-capture #jc-capabilities).
[entry.criteria.acceptance-offline-save]
cannot_host = "capture cannot take the browser offline (device capability unsupported); proven by tests/runtime-review-live.mjs"
[entry.criteria.acceptance-offline-reconnect]
cannot_host = "capture cannot take the browser offline (device capability unsupported), so no reconnect; proven by tests/runtime-review-live.mjs"
[entry.criteria.acceptance-offline-closed]
cannot_host = "capture cannot take the browser offline (device capability unsupported), so no offline save to reopen; proven by tests/runtime-review-live.mjs"

# Stories this environment cannot host. services.review runs with HOME and XDG under
# $QA_ROOT: no evidence or wake provider, no Herdr, no live agent, no review-host
# (the fixture writes the registry), no lane-key slug and one project. The fake Jev
# answers scope, rule, and coverage (each criterion verifies its data-story story);
# every other question answers unrelated. Each reset registers fresh projects, which
# the service warms before the story starts.
[entry.criteria.acceptance-reviewed-kept]
cannot_host = "the reviewed base is written by review-host when a hand-off is processed; review-host does not run here (the fixture writes the registry)"
[entry.criteria.acceptance-reviewed-accepted]
cannot_host = "the accepted flag is written by review-host reviewed; review-host does not run here (the fixture writes the registry)"
[entry.criteria.acceptance-warm]
cannot_host = "register is review-host's, which does not run here (the fixture writes the registry)"
[entry.stories.story-proven]
cannot_host = "no evidence provider (providers/evidence.toml absent), so no criterion carries evidence"
[entry.stories.story-open-proof]
cannot_host = "no evidence provider (providers/evidence.toml absent), so no evidence to open"
[entry.stories.story-branch]
cannot_host = "no evidence provider (providers/evidence.toml absent), so no evidence notes to judge"
[entry.stories.story-what-changed]
cannot_host = "no evidence provider (providers/evidence.toml absent), so no QA stale criterion"
[entry.stories.story-reproof]
cannot_host = "no evidence provider (providers/evidence.toml absent), so no QA stale criterion"
[entry.stories.story-plugin]
cannot_host = "the BB plugin is not run here, and no evidence provider"
[entry.stories.story-human-handoff]
cannot_host = "no wake provider and no Herdr, so no owner pane to wake"
[entry.stories.story-wake-failed]
cannot_host = "no wake provider and no Herdr, so no owner pane to lose"
[entry.stories.story-no-provider]
cannot_host = "register output (wake=unavailable) comes from review-host, which does not run here (the fixture writes the registry)"
[entry.stories.story-change-type]
cannot_host = "fake Jev answers only scope, rule, and coverage questions; change-type answers unrelated"
[entry.stories.story-orphan]
cannot_host = "fake Jev answers only scope, rule, and coverage questions; orphan placement answers unrelated, and the fixture has no threads"
[entry.stories.story-resolved]
cannot_host = "fake Jev answers only scope, rule, and coverage questions; resolves answers unrelated, and the fixture has no threads"
[entry.stories.story-corpus]
cannot_host = "fake Jev answers only scope, rule, and coverage questions; contradicts and oversteps answer unrelated"
[entry.stories.story-cross-lane]
cannot_host = "one lane slug only, and fake Jev answers only scope, rule, and coverage questions"
[entry.stories.story-coverage]
cannot_host = "every fixture story has its verifying criterion and every criterion its story, so no coverage gap to show or clear"
[entry.stories.story-neutral]
cannot_host = "Jev is on through the fake provider, which never fails, so Jev off or unavailable cannot occur"
[entry.stories.story-fast-marks]
cannot_host = "Givens need box load above CPU count; QA creates no synthetic load"
[entry.stories.story-note-action]
cannot_host = "fake Jev answers only scope, rule, and coverage questions, so no Contradicts, gap, or change note carries its button"
[entry.stories.story-settled]
cannot_host = "fake Jev answers only scope, rule, and coverage questions, so no orphan, gap, or conflict mark to settle"
[entry.stories.story-no-walls]
cannot_host = "fake Jev answers every question at 0.95, so no below-threshold or verify-band answer and no general LLM"
[entry.stories.story-right-pairs]
cannot_host = "fake Jev answers only scope, rule, and coverage questions; no Contradicts or Oversteps flag"
[entry.stories.story-no-noise]
cannot_host = "fake Jev answers only scope, rule, and coverage questions; no flag to withhold"
[entry.stories.story-context]
cannot_host = "fake Jev answers only scope, rule, and coverage questions; no flag popover to quote"
# Rule criteria the fixture cannot drive: one rule, one home, answered only by the fake.
[entry.criteria.acceptance-pending]
cannot_host = "fake Jev answers every rule check at 0.95, so no check escalates to the general LLM and no checking wheel shows"
[entry.criteria.acceptance-card-cites]
cannot_host = "fake Jev answers only scope, rule, and coverage questions, so no clause is marked Contradicts against a rule"
[entry.criteria.acceptance-copies]
cannot_host = "the fixture holds one rule in one home spec, no linked copies and no second every-feature rule"
[entry.criteria.acceptance-own-project]
cannot_host = "the fixture's projects are copies of one repo with the same rule text, and fake Jev answers no Contradicts, Oversteps, Overlaps, or cross-lane question, so no mark can show which project it cites"
[entry.criteria.acceptance-own-project-lane]
cannot_host = "fake Jev answers no contradiction question, so no two lanes contradict and no cross-lane mark or pair exists"
[entry.criteria.acceptance-clear]
cannot_host = "the When is an agent edit to the spec file while the reviewer views the card; capture edits no file and the fixture lands no edit on a plain reload"
[entry.criteria.acceptance-dismiss-return]
cannot_host = "the When changes the rule's text in its home spec file; capture edits no file, and fake Jev reads only the fixture's one rule text as applying to every feature"
[entry.criteria.acceptance-new-candidate]
cannot_host = "the fixture's head adds no every-feature criterion: fake Jev reads only the onboarding rule, in the base, as one, and a second would change every other criterion's rule counts"
[entry.criteria.acceptance-review-index]
cannot_host = "the fixture registers one lane slug and one project; index Givens need several lane slugs, settled and unregistered specs"
[entry.criteria.acceptance-index-sections]
cannot_host = "the fixture registers one lane slug and one project; index Givens need several lane slugs, settled and unregistered specs"
[entry.criteria.acceptance-index-design]
cannot_host = "the fixture registers one lane slug and one project; index Givens need changed, up-to-date, and settled specs across lanes"
[entry.stories.story-stable-url]
cannot_host = "the fixture registers one repository and one project; Givens need two projects from two repositories"
[entry.stories.story-operator]
cannot_host = "needs a live shaping agent and issue tracker"
[entry.stories.story-agent]
cannot_host = "needs a live agent and a wake provider; neither runs here"
[entry.stories.story-compatible-review]
cannot_host = "preflight runs in review-host before the server starts; review-host does not run here"
[entry.stories.story-review]
cannot_host = "repairs are run by an agent with the repair skill; no live agent here"
[entry.stories.story-catch-up]
cannot_host = "repairs are run by an agent with the repair skill; no live agent here"
[entry.stories.story-box-service]
