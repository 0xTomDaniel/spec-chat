# The stage a message was written in (threads.spec.html#stage-tag): the box names each lane's stage (spools.py STAGES),
# and every bubble shows the stage its message was written in, a small tag beside its author, as "Mango · Spec review".
# Capture hints, per criterion:
# - stage-tag: the QA-17 lane at Spec review, Report filters with no thread. Turn on Comment, click the filter criterion,
#   type the value, press Comment.
# - stage-kept: the QA-18 lane, now at Code review, holds Mango's thread on the filter criterion, written at Spec review.
# - stage-reply: the QA-19 lane, now at Merge ask, holds Mango's thread on the filter criterion, which the agent answered
#   at Code review; press its replies line "1 reply · Agent: …".
# - stage-lane, stage-none: the host page's first item, Weekly report QA run, an evidence item in a scope that holds no
#   spec; stage-lane's anchor names the QA-20 lane, at QA, and stage-none's names none. Click "Comment on Weekly report QA
#   run", type the value, save.
# - stage-reply-lane: the same item, its anchor naming QA-20, at QA, in a scope that holds no spec, holds Mango's thread,
#   which the agent answered at QA; click "Comment on Weekly report QA run", then press its replies line "1 reply · Agent: …".
[nav.acceptance-stage-tag]
path = "{review}/qa-17/docs/specs/later-only.spec.html"
[nav.acceptance-stage-kept]
path = "{review}/qa-18/docs/specs/later-only.spec.html"
[nav.acceptance-stage-reply]
path = "{review}/qa-19/docs/specs/later-only.spec.html"
[nav.acceptance-stage-lane]
path = "{review}/layer-stage-lane/docs/pane.html"
[nav.acceptance-stage-none]
path = "{review}/layer-stage-none/docs/pane.html"
[nav.acceptance-stage-reply-lane]
path = "{review}/layer-stage-reply-lane/docs/pane.html"

# A picture of a boxed spot (threads.spec.html#box-picture): the test shell's native page, a factory floor drawn on a
# canvas (shell.py), held beside the comment UI page, makes a picture of a box dragged across it. Capture hints:
# - box-picture: press Comment in the comment UI, then drag a box across the QA-1514 card, in the Review station, which
#   reads QA failed; type the value, press Comment; then press the comment's bubble. The focused thread shows, under the
#   comment, the picture of the card with the box drawn on it, captioned "What you saw when you wrote".
[nav.acceptance-box-picture]
path = "{shell}/native/shell-box-picture"

