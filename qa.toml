# on a paragraph: tap Comment in the bottom toolbar, tap the paragraph, type the value, tap the composer's Comment. The
# bottom toolbar holds the drafts note, Next TBD (2), and "Hand off to agent →"; "Open review sidebar" opens the panel.
# - mobile-one-control: after the draft, open the review panel.
# - mobile-count: the first value on "The report page shows totals per week.", the second on another paragraph.
# - mobile-handoff-wake: the owner's wake is a line the fixture's wake provider (reset.sh) logs; no screen shows it.
# - mobile-handoff-frame, served-reload-*: the test host frames the spec with no origin; reloading the page is its frame
#   reloading alone, the host page staying.
# - served-reload-outbox: take the browser offline before saving the draft, and back online before the reload. On a
#   phone a draft's text reads only in the review panel: after the reload, open it with the "Open review sidebar"
#   button at the top right.
# Frame storage (served-pages #served-storage), at desktop width: a draft comment on a paragraph is Comment in the top
# line, a click on the paragraph, the value typed, then the composer's Comment.
# - served-storage-service, served-storage-return: the host's header buttons Service 1 and Service 2 open this spec from
#   the first and the second review service in the host's frame. Take the browser offline before saving the draft;
#   press Service 2 while still offline, so the frame leaves the first spec (it shows the browser's offline page), then
#   bring the browser back online and press Service 2 again. served-storage-return: then press Service 1, open the review
#   panel with the "Open review sidebar" button at the top right, and press "Hand off to agent".
# - served-storage-stored: online throughout. Save the first value as a draft on the first spec; press Service 2 and save
#   the second value as a draft there; press Service 1, open the review panel with the "Open review sidebar" button at
#   the top right, and press "Hand off to agent".
# - served-storage-host-named: the start point is the host page that names its frame and clears the name once the page
#   has loaded. Take the browser offline before saving the draft, and back online after it.
