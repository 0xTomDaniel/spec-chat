# Pages a shell holds (shell.spec.html#acceptance-shell-*): each criterion opens its shell-* collection (spools.py
# SHELL, panes.py) in the test shell ({shell}, shell.py), which holds the page at the left and frames the comment UI page
# at the right: its head reads Conversation, with the page's title and its counts; its bar under the conversation holds
# Comment, the drafts, Next TBD, and "Hand off to agent →" or Accept spec; × at its head's right is its close control.
# The held page shows its pins and no review panel, Comment, or Hand off of its own. Weekly report is report.spec.html,
# Report filters later-only.spec.html. Capture hints, per criterion:
# - shell-held: Mango's thread on the totals criterion. shell-alone: the same, opened in a plain tab, no shell.
# - shell-unnamed: the same, in the shell at an origin the box does not name ({shell-other}); it says hello with comments.
# - shell-pick: press Comment in the comment UI, click the totals criterion "The report page shows totals per week." in
#   the page, type the value, press Comment in the comment UI.
# - shell-publish: open the shell bar's Messages: the last publish names the page's address, its version, and the export
#   format question with its two answers.
# - shell-pick-key: click the page's title, press C, click the totals criterion in the page.
# - shell-show: Report filters, whose filter criterion forty filler paragraphs put far below; press the thread's chip,
#   "Acceptance criteria · The report page filters rows by the…", in the comment UI.
# - shell-pin-focus: Report filters' one thread; press its pin, the numbered marker at the filter criterion's right.
# - shell-handoff: the shell's frames have no origin ({shell}/bare/<path>), so the comment UI page takes the shell's
#   browser id, which its start point keeps as Papaya's in the shell's storage: the one draft, on the totals criterion,
#   is this browser's. Press "Hand off to agent →" in the comment UI.
# - shell-accept: Report filters, its one thread resolved, no open TBD. shell-accept-waits: Weekly report, its one thread
#   resolved, the export format its one open question.
# - shell-answer: Weekly report, the export format its one open question; press "CSV only (recommended)" in the page's
#   Behavior section.
# - shell-page-tools: the page's top line shows the compared range and Change base; the Jev marks load after a moment.
# - shell-mockup-step: the Team panel mockup at its first step, Mango's thread on the desktop Payments card at its second;
