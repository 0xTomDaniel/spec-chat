# - shell-host-item: a workbench pane; press "Comment on Agent turn 42", the control at the item's top right, which holds
#   Papaya's thread, then Mango's.
# - shell-close: press × at the comment UI's head.
# - shell-native: the shell's own native page ({shell}/native/<collection>, shell.py), a factory floor drawn on a canvas
#   with no Spec Chat script: its lane cards are things with no page element. Papaya's thread is on the QA-1514 card, in
