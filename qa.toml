# Comment layer on host pages (comment-layer #acceptance-host-*, -one-thread-*, -no-scope, -no-service): each criterion
# opens its collection's host page, docs/pane.html (tests/fixtures/qa/panes.py), a workbench pane of three items; the
# host-place-* pages open on a fourth above them, Agent turn 46, whose band keeps the layer's row clear (panes.py
# PLACE).
# "Totals per week" anchors the report spec's totals criterion in the collection's scope, "Agent turn 42" a subject that
# names no spec, both with the starters Question, Change, and Approve; "Agent turn 43" names a scope no row has. An item's
# comment control is the button at its top right, named "Comment on <item>"; its threads' pins sit left of it, named
# "Open thread <n>: <item>, <status>"; the thread box opens beside the item, its bar holding the page's drafts and "Hand off
# to agent →". Seeded comments are other browsers', but host-handoff's and host-handoff-two's drafts, whose start point
# keeps Papaya's browser identity, the page's own saved state, so they are this browser's.
# Capture hints, per criterion:
# - host-draft: click "Comment on Totals per week", then the Question starter, type the value, click Comment; the
#   draft begins with Question.
# - host-starters, host-only-comments: click "Comment on Totals per week".
# - host-handoff: the draft is on Agent turn 42. Hand off is in the bar of an item's thread box, which a thread opened
#   by its pin dims: open the box with "Comment on Agent turn 42".
# - host-handoff-two: the drafts are on Totals per week and Agent turn 42. Open a box for Hand off with "Comment on
#   Totals per week", as in host-handoff; then open Agent turn 42's thread with its pin.
# - host-reply, host-quote-gone: open Agent turn 42's thread with its pin.
# - host-same-subject: the page is pane-other.html; Agent turn 42's thread was written on pane.html. Open it with its pin.
# - host-quote: select the words "named the columns after the table headers" in Agent turn 42, then click "Comment on
#   Agent turn 42", type the value, click Comment.
# - host-frame: the test host serves pane.html in a frame with no origin. Click "Comment on Agent turn 42", type the
#   value, click Comment, then "Hand off to agent →".
# - one-thread-spec: click "Comment on Totals per week", type the first value, click Comment; then open the spec page at
#   the second value and its thread "Open thread 1".
# - one-thread-host: open Totals per week's thread with its pin; the comment was written on the spec page.
# - no-scope: Agent turn 43 shows no control. no-service: the page loads its layer from a stopped review service.
# - host-place-scrolled: Agent turn 46's "Full text" button sits just below its row, at its right. Scroll the page down
#   until Agent turn 46's top sits about 40 px above the screen, then click the right end of what shows of "Full text".
# - host-place-grows: click Agent turn 46's "Full text"; Totals per week, the item below it, moves down.
