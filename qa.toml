# Threads as one conversation (threads.spec.html#acceptance, spec-page-design #acceptance-color-consistency): each
# criterion opens its threads-* collection (spools.py THREADS), Report filters (later-only.spec.html) unless its path
# names Weekly report or Report walkthrough. Seeded reviewers are Papaya and Mango; where the criterion's reviewer owns a thread, the start point
# keeps Papaya's browser identity, the page's own saved state, so Papaya's messages are this browser's, at the panel's
# right. The review panel opens with the "Open review sidebar" button at the top right; its head reads Conversation.
# Each thread's first message is a bubble with a chip under it naming its block, its replies fold into one line reading
# "<n> replies · <author>: <first words>", and its receipt (Draft, Sent, Seen, or Resolved) sits under its newest reviewer
# message; a resolved thread is one line. Pressing a message opens its thread focused, with Conversation (back) at its
# top left, Resolve at its top right, and a Reply field with a Save reply arrow under it.
# Capture hints, per criterion:
# - stream-order: three threads, begun on the Behavior TBD, then on the context paragraph, then on the filter criterion.
# - sides: Papaya's comment on the filter criterion, answered by the agent; press its replies line "1 reply · Agent: …".
# - replies-folded, replies-open: Mango's thread on the filter criterion holds three replies, Papaya's on the context
#   paragraph none. replies-open: press "3 replies · Agent: …".
# - focus, focus-phone: Papaya's thread on the filter criterion holds three replies, Mango's on the context paragraph
#   none. focus: press Papaya's bubble "Does the filter remember the last team?". focus-phone: tap the filter criterion's
#   pin, the numbered marker at its right.
# - focus-reply: Papaya's comment, answered by the agent. Press Papaya's bubble, type the value in the Reply field, press
#   Save reply, then press Conversation at the focused thread's top left.
# - focus-pin: one thread on the filter criterion; press its pin, the numbered marker at the criterion's right.
# - chip-jump: one thread on the filter criterion, which forty filler paragraphs put far below the top of the page. Press
#   the thread's chip, "Acceptance criteria · The report page filters rows by the…".
# - receipt-sent: Papaya's draft on the filter criterion; press "Hand off to agent →" in the panel.
# - receipt-draft: no thread. Turn on Comment, click the filter criterion, type the value, press Comment.
# - receipt-seen: Mango's comment the agent acknowledged without a reply. receipt-resolved: Mango's thread of three
#   messages, resolved.
# - waiting-pin: Mango's thread on the filter criterion ends with the agent's reply; Papaya's on the context paragraph
#   ends with Papaya's own reply. The page as it opens, its panel closed.
# - waiting-root: the QA-21 lane at Spec review, Report filters. Papaya's thread on the filter criterion holds Papaya's
#   reply between the agent's two and ends with the agent's; Papaya's on the context paragraph ends with Papaya's own
#   reply.
# - question-bubble, question-answer, question-same: Weekly report, whose one open question is the export format, offering
#   "CSV only (recommended)" and "CSV and XLSX"; question-bubble also holds Mango's thread on the totals criterion. "One
#   answer button" is "CSV only (recommended)" in the question's bubble at the end of the conversation, not the one in the
#   page's Behavior section.
# - color-consistency: a draft thread on the context paragraph, an acknowledged one on the filter criterion, and a
#   resolved one on the Behavior TBD.
# - layer-stream: the host page's Agent turn 42 holds Papaya's thread, then Mango's; click "Comment on Agent turn 42".
# - video-moment, video-box, video-chip: Report walkthrough (report-video.spec.html), whose Walkthrough section shows a
#   four-second video of the report page. video-moment: play the video for about a second and a half, pause it, turn on
#   Comment, click the video, type the value, save. video-box: play it for about a second, pause it, turn on Comment, drag
#   a box across part of the video's frame, type the value, save. video-chip: Mango's thread on a box at 0:01; play the
#   video for about three seconds, open the review panel, press the thread's chip "Walkthrough · 0:01 · Box".
# - video-layer: the host page's item Report walkthrough shows the same video; play it for about a second, pause it,
#   click "Comment on Report walkthrough", type the value, save.
