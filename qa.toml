# Walkthroughs, threads at a step, and questions on the mockup (mockups.spec.html#acceptance-steps-bar to -chip-step). The
# walkthrough collections (reset.sh mockups, spools.py WALKTHROUGHS) add to Report page's set 04 Team panel, the report page
# whose walkthrough has three steps: 1 Totals, the team cards; 2 Team open, reached by pressing the Payments card's "Last three
# weeks" button, Payments' card edged in blue beside its panel of its last three weeks; 3 Export, reached by that panel's
# Export CSV button, the export dialog listing the rows the CSV holds. mockup-steps also adds 05 Export flow, the same screen
# walked in six steps (then the file named, the CSV downloading, and downloaded). The step bar sits under the top line:
# Play, then each step by number and name, the showing one pressed with its caption beside the steps. mockup-step-pin holds
# Mango's handed-off comment on the desktop frame's Payments card at step 2. mockup-questions holds two open questions, one
# on the Payments card at step 2 ("Should Payments' card keep its blue edge while its panel is open?", answers "Keep the blue
# edge (recommended)" and "Plain card"), one on the export dialog's file name at step 3; mockup-question-answer, -words,
# -phone, and -accept hold the first alone. A question shows a "?" mark on the parts it is about while its step shows; Next
# TBD sits beside Hand off (in the review panel on a desktop, in the bottom toolbar on a phone).
# Capture hints, per criterion:
# - steps-bar: nothing to click. step-jump: press step 3 in the step bar. play: press Play, then wait about 8 seconds until
#   it is offered again. step-press: press the "Last three weeks" button on the Payments card in the desktop frame.
# - steps-phone: swipe the step bar left, then tap step 6.
# - step-thread: press step 2, turn on Comment, click an empty spot inside the Payments card in the desktop frame, right of
#   its "Last three weeks" button, type the value, save.
# - step-pin: press step 1. step-chip: open the review panel, press the thread's chip under Mango's bubble.
# - question-mark: press step 2. question-next: open the review panel, press Next TBD once (the card's question is first).
# - mockup-question-answer: open the review panel, press Next TBD, then "Plain card" in the question.
# - question-words: open the review panel, press Next TBD, then the question's Reply, type the value, save.
# - question-phone: tap Next TBD in the bottom toolbar, then "Plain card" in the sheet.
# - question-accept: the page is Report page's spec page; open the review panel.
# - chip-step: the page is Report page's spec page; press the "See mockup · Team panel" chip after the criterion "Pressing a
#   team's card opens its team page, listing its totals for the last three weeks."
