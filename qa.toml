# A running prototype as a screen's mockup (mockups.spec.html#acceptance-prototype-frames to -round-video-comment, and
# the screen whose mockup #acceptance-fidelity-rule's reviewer reviews). The prototype collections (reset.sh prototypes,
# spools.py PROTOTYPES) add to Report page's set 06 Weekly report, a prototype mockup of the fixture's running prototype
# (services.prototype): its page frames the route reports/weekly at desktop and phone width, held, under the top line
# and its step bar: 1 Totals, the three team cards (Payments, Search, Mobile); 2 Team open, reached by pressing the
# Payments card, its panel of the last three weeks fading in with an Export CSV button; 3 Export, reached by that
# button, the export dialog naming payments-2026-W01.csv. Its regions: Team cards, Payments card, Team panel, Export
# button, Export dialog. Its one open question, on the team panel at step 2, asks for a trend line. Under the frames,
# "This round's video", recorded from the second round's commit, plays with the walkthrough's step captions, and Earlier
# rounds (1) offers the first round's. prototype-down's row names a port where nothing answers, and its mockup holds
# Mango's handed-off thread on the team panel at step 2. They are on review-prototype ({review-prototype}), so each
# frame runs the route at the lane's own prototype origin, http://<slug>-prototype.localhost:<port>, where the fixture's
# product serves its page, script, and style only at its root (prototype-root). prototype-own-chrome's set also holds 07
# Report spec, a prototype mockup of the lane's own review service run as its prototype: its frames hold Report's spec
# page, served by that service, whose totals criterion (The report page shows totals per week.) is its one region, Totals
# criterion; the framed page shows its top line and no review panel or toolbar.
# Capture hints, per criterion:
# - fidelity-rule: the page is Weekly report's mockup page, that screen's mockup; review it as it opens, nothing to click.
# - prototype-frames: nothing to click.
# - prototype-root: nothing to click.
# - prototype-own-chrome: turn on Comment, click the criterion The report page shows totals per week. in the desktop
#   frame (the wider frame), type the value, save.
# - round-video: scroll to the bottom of the page.
# - round-video-old: scroll to the bottom of the page.
# - round-video-phone: scroll below the frames to "This round's video", play it for about two seconds.
# - prototype-comment: the page opens at step 2 by its address (?step=team-open, the address a See mockup chip opens a
#   step at); wait for the team panel, turn on Comment, click the Export CSV button in the desktop frame (the wider
#   frame), type the value, save.
# - prototype-press: with Comment off, click the Payments card in the desktop frame.
# - prototype-down: open the review panel.
# - prototype-updated: nothing to click. The fixture agent commits to the lane branch once the open page has first checked
#   its file (tests/fixtures/qa/serve.py), a moment after it loads; wait 6 seconds on the page.
# - round-video-comment: scroll to the bottom of the page, play the round's video under the frames for about two
#   seconds, pause it, turn on Comment, click the video, type the value, save.
