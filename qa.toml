# Review index (review-index #index-threads, #index-gates, #index-design, #index-marks), at the server root. The
# review service ({review}) has no evidence provider; review-plugged ({review-plugged}) has one, answering from the
# evidence service's declared review facts (reset.sh); review-sections ({review-sections}) holds the index parts alone.
# Lane-key collections (tests/fixtures/qa/spools.py LANES, their one table) are lanes: a header (QA-1, its need count, a Proof
# link when one is named) over its project label and its spec rows; every other collection settles under Settled (n).
# Each spec row leads with its status mark, then its title, its gate word on the right, and one muted meta line under
# the title (thread counts, then Changed).
# - QA-1 and QA-2 hold the four fixture specs (Weekly report changed since base, Onboarding
#   unchanged, Report filters and Report sorting absent at base); Weekly report and Report sorting
#   hold open TBDs. QA-1's Weekly report holds a draft, a handed-off, a replied, and a resolved
#   thread (3 open, 1 resolved); QA-2's one open thread, replied by the agent; QA-2 also holds
#   docs/specs/archive.spec.html, registered from a worktree since removed (reset.sh), a stale row.
# - QA-3 to QA-7 each hold Report filters alone (no open TBD) with one thread: QA-3 handed off,
#   not answered; QA-4 and QA-5 resolved; QA-6 replied by the agent, not resolved; QA-7 a comment
#   saved, not handed off.
# - On review-plugged, QA-8 and QA-9 each hold Report filters alone, no thread: the evidence
#   provider names QA-8's accepted at the fixture's head commit, and a proof bundle for QA-9. QA-10
#   holds Weekly report (open TBDs), Report filters handed off and not answered, and "Weekly report
#   export to spreadsheets, with per-team totals, saved filters, and the chosen sort kept between
#   visits", a long title with no TBD and no thread.
# - QA-15 holds Report page alone, no thread: its reviewer pressed Accept spec while its mockup set held 01 Report page
#   and 02 Team page, so the hand-off names those two at the versions their pages show; the set has since gained 03
#   Export dialog, which it does not name. QA-16 holds Report filters alone, its spool holding a link in place of an
#   event, so the index cannot read its review state.
# Capture hints, per criterion:
# - review-index, index-threads, index-threads-none: read the QA-1 lane. Its Weekly report
#   row holds a draft, a handed-off, a replied, and a resolved thread (3 open, 1 resolved);
#   its other rows have no threads.
# - index-sections, on review-sections: QA-11 holds Weekly report alone (open TBDs); QA-12 holds Report filters alone,
#   its one thread handed off and not answered; the main collection's slug is no lane key and holds the four fixture
#   specs. Read the part headings and both lanes, then open Settled at the bottom. A registry serves its rows only, so
#   no spec there is served without a row; that case is proven by tests/review-serve-multi.py
#   test_index_settles_specs_served_without_a_row_in_a_closed_disclosure.
# - index-gate-decision: read QA-1's Weekly report row (open TBDs and a handed-off thread).
# - index-gate-reply: read the QA-6 lane. index-gate-draft: read the QA-7 lane.
# - index-gate-agent: read the QA-3 lane. index-gate-ready, index-no-provider: read the QA-4 lane.
# - index-gate-sent: click the QA-5 lane's "Report filters" title; on the spec page open the review
#   sidebar with its "Open review sidebar" button (top right), click "Accept spec", then click
#   "Review index"; read the QA-5 lane.
# - index-gate-sent-new-mockup: read the QA-15 lane.
# - index-stale-unreadable: read the QA-16 lane. docs/specs/later-only.spec.html shows as plain text with the word
#   Stale on the right and no link.
# - index-gate-accepted: read the QA-8 lane on review-plugged.
# - index-proof: click the QA-9 lane's "Proof" link on review-plugged; it opens in a new tab.
# - index-design: read the Needs you and In progress lanes and the settled specs below them: no
#   spec row reads "Up to date", each lane spec row shows its gate word once beside its mark, each
#   lane header how many of its specs need you, and the page has no sideways scroll. QA-2's stale
#   row has no gate or status; the word Stale is its only word (review-index #index-entry-status).
# - index-threads-refresh: QA-2's Weekly report has one open thread, replied by the agent.
#   Steps: click that row's "Weekly report" title in the QA-2 lane; open the thread with its
#   "Open thread 1" button, which shows it focused; click its "Resolve" button; click "Review index" (the
#   reload); read the QA-2 Weekly report row.
# - index-stale: read the QA-2 lane. Its four specs are title links; docs/specs/archive.spec.html
#   shows as plain text with the word Stale on the right and no link.
# - index-title-column (story-index-calm, a narrow pane, its viewport above): read the QA-10 lane on
#   review-plugged. Its long title wraps in its own column; Ready to accept stays on the right, beside the
#   title's first line.
# - index-marks: on review-plugged, read QA-10's Weekly report (Decision open) and Report filters (With the agent)
#   rows, and QA-8's Report filters (Accepted) row: each leads with its mark.
# - index-focus: on the review service, whose lanes show no Proof link, so a spec title is the page's first Tab stop
#   (on review-plugged, QA-9's Proof link comes first, and a Proof link is no title). Press Tab until the QA-1 lane's
#   Report filters title has focus: from page load, the first Tab lands on it.
