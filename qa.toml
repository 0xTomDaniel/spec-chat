# Review-state collections (tests/fixtures/qa/spools.py). Seeded reviewers are other
# browsers than the capture browser.
#
# Capture hints, per criterion (the capture agent reads these):
# - anchor-moved, anchor-changed, anchor-gone: Papaya's comment is on the selected
#   sentence "The export button downloads a CSV of the current table.". The agent's edit
#   is already on disk before the page loads (moved: a paragraph inserted above it;
#   changed: "of the current table." rewritten; gone: the sentence deleted), so the
#   page load is the refresh. Do not edit any file. The step left is opening that thread
#   with its "Open thread 1" button, so the panel shows its pin ring, quote, and notice
#   (gone: "Text removed" shows only in the opened thread).
# - stale-page: the agent's edit (a paragraph inserted above the export sentence) waits
#   beside the spec and lands when this page next saves an event (tests/fixtures/qa/
#   serve.py), so the page as loaded predates the edit. Steps: turn on Comment (C),
#   select the export sentence's text, type the comment text from values, save. The save
#   brings the "Spec updated by agent" banner; its Reload button is the Then's refresh.
# - name: four steps, all required; do not stop after the first save. 1) Turn on Comment
#   (C), click any block, type the first value, save. The fixture agent answers that comment
#   as it saves (tests/fixtures/qa/serve.py), so the thread offers Reply. 2) Reload the page
#   (browser reload, not the banner). 3) Open that thread with its "Open thread 1" button.
#   4) Click Reply, type the second value, save. Then capture the thread: both of this
#   reviewer's messages and their author.
[nav.acceptance-anchor-moved]
path = "{review}/anchor-moved/docs/specs/report.spec.html"
[nav.acceptance-anchor-changed]
path = "{review}/anchor-changed/docs/specs/report.spec.html"
[nav.acceptance-anchor-gone]
path = "{review}/anchor-gone/docs/specs/report.spec.html"
[nav.acceptance-anchor-stale-page]
path = "{review}/stale-page/docs/specs/report.spec.html"
[nav.acceptance-agent-scan]
path = "{review}/agent-scan/docs/specs/report.spec.html"
[nav.acceptance-name]
path = "{review}/name-reply/docs/specs/report.spec.html"

# Review index (lane-hosting #index-threads, #index-gates), at the server root. Lane-key collections
# (tests/fixtures/qa/spools.py INDEX_LANES) are the Needs you cards: QA-1 and QA-2, each
# holding the four fixture specs (Weekly report changed since base, Onboarding unchanged,
# Report filters and Report sorting absent at base), Weekly report and Report sorting reading
# Decision open (open TBDs), the other two Ready to accept, each card "4 need you"; QA-2 also holds
# docs/specs/archive.spec.html, registered from a worktree since removed (reset.sh), a stale
# row. Every other collection settles.
# Capture hints, per criterion:
# - review-index, index-threads, index-threads-none: read the QA-1 card. Its Weekly report
#   row holds a draft, a handed-off, a replied, and a resolved thread (3 Open, 1 Resolved);
#   its other rows have no threads.
# - index-design: read the Needs you cards and the settled specs below them: each lane spec row shows
#   its gate word once, each card how many of its specs need you, "Up to date" shows nowhere, and the
#   page has no sideways scroll. QA-2's stale row has no gate or status; its Stale pill is its only
#   word (lane-hosting #index-entry-status).
# - index-threads-refresh: QA-2's Weekly report has one open thread, replied by the agent.
#   Steps: click that row's "Weekly report" title in the QA-2 card; open the thread with its
#   "Open thread 1" button; click its "✓ Resolve" button; click "Back to Spec Chat index" (the
#   reload); read the QA-2 Weekly report row.
# - index-stale: read the QA-2 card. Its four specs are title links; docs/specs/archive.spec.html
#   shows as plain text with a Stale pill on the right and no link.
[nav.acceptance-review-index]
path = "{review}/"
[nav.acceptance-index-threads]
path = "{review}/"
[nav.acceptance-index-threads-none]
path = "{review}/"
[nav.acceptance-index-threads-refresh]
path = "{review}/"
[nav.acceptance-index-design]
path = "{review}/"
[nav.acceptance-index-stale]
path = "{review}/"

# Pages served at another address (review-service #story-served): each criterion opens its served-*
# collection's report spec in the test host, which frames it with no origin. reset.sh records a public
# base address, so the review service answers that frame (entry.criteria below map the fixture).
# Capture hints, per criterion:
# - served-threads: the report spec holds one open thread, Papaya's, replied by the agent. The step
#   left is opening that thread with its "Open thread 1" button.
# - served-handoff: turn on Comment (C), click the "The report page shows totals per week." block,
#   type the value, save, then click "Hand off to agent →".
# - served-index: click "Back to Spec Chat index".
# - served-focus: focus on changes is turned on by choosing its baseline: click "Change base", then
#   the older listed commit (subject "base").
[nav.acceptance-served-threads]
path = "{host}/served-threads/docs/specs/report.spec.html"
[nav.acceptance-served-handoff]
path = "{host}/served-handoff/docs/specs/report.spec.html"
[nav.acceptance-served-index]
path = "{host}/served-index/docs/specs/report.spec.html"
[nav.acceptance-served-focus]
path = "{host}/served-focus/docs/specs/report.spec.html"

# Undeclared coverage (jev-suggestions #acceptance-coverage-undeclared): the spec is coverage-undeclared's
# print.spec.html, "Report printing", changed since its base. Its start compares it with its own head (base=HEAD), so
# the page is not in Git focus. Git focus is turned on by choosing its baseline: click "Change base", then the older
# listed commit (subject "base").
[nav.acceptance-coverage-undeclared]
path = "{review}/coverage-undeclared/docs/specs/print.spec.html?base=HEAD"

# Status route (review-service #steady-status): {review}/api/status (values). No page links to it, so it is opened at
# that address.
# - steady-closed: starts on the report spec, so the service serves this browser a spec page; the start point then
#   closes it by clicking its "Back to Spec Chat index" link.
[nav.acceptance-steady-closed]
path = "{review}/qa-fixture/docs/specs/report.spec.html"
selectors = ['a[data-spec-chat-navigation="index"]']

